resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 18084;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 移动端 H5 入口（SPA fallback 到 mobile.html）
    location /m/ {
        try_files $uri $uri/ /mobile.html;
    }

    location = /m {
        return 301 /m/;
    }

    # 注意：backend 容器重建会换 IP，必须用变量式 proxy_pass 走 resolver 动态解析，
    # 否则 nginx 缓存旧 IP 导致 /api/ 502
    location /api/ {
        set $upstream http://backend:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 文件存储静态目录（FastAPI 通过 StaticFiles 挂载在 backend:/uploads）
    location /uploads/ {
        set $upstream http://backend:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }
}
