[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 全局异步引擎池跨事件循环会损坏连接：fixtures 与测试必须统一绑到 session 级循环。
# 注意：这两行是测试套件正常工作的硬性前提，勿删（曾因工作区被并行改动丢失导致全部用例跨循环报错）。
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning
