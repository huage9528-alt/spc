[alembic]
script_location = alembic
prepend_sys_path = .
# NOTE: the real URL is injected by alembic/env.py from app Settings / env vars; keep this placeholder ASCII-only (alembic reads ini with locale encoding)
sqlalchemy.url = postgresql+psycopg2://user:password@localhost:5432/spc_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
